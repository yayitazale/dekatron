substitutions:
  name: elekstube
  timezone: Europe/Madrid

esphome:
  name: ${name}
  friendly_name: EleksTube IPS
  on_boot:
    priority: 600
    then:
      - ds1307.read_time:
          id: rtc
      - lambda: |-
          auto now = id(rtc).now();
          id(rtc_boot_time) = now.is_valid() ? now.strftime("%Y-%m-%d %H:%M:%S") : "No valid time";
          ESP_LOGI("clock", "RTC time at boot: %s", id(rtc_boot_time).c_str());

globals:
  - id: rtc_boot_time
    type: std::string
    initial_value: '"Not read"'

text_sensor:
  - platform: template
    name: Animation State
    icon: mdi:animation
    state_topic: elekstube/${name}/animation/state
    update_interval: 1s
    lambda: return id(tubes).animation_state();
  - platform: template
    name: RTC Time at Boot
    icon: mdi:clock-check-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: return id(rtc_boot_time);

esp32:
  variant: esp32
  flash_size: 4MB
  partitions: partitions.csv
  framework:
    type: esp-idf

external_components:
  - source: components

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "EleksTube Setup"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: elekstube/${name}
  discovery: true
  on_json_message:
    topic: elekstube/${name}/animation/play
    then:
      - lambda: |-
          id(tubes).play_request(x["type"] | "effect", x["name"] | "", x["tubes"] | "all", x["duration"] | 10,
                                 x["priority"] | 2, x["color"] | "", x["text"] | "", x["scroll"] | false);
  on_message:
    topic: elekstube/${name}/animation/stop
    then:
      - lambda: id(tubes).stop_animation();

i2c:
  sda: GPIO21
  scl: GPIO22

time:
  - platform: ds1307
    id: rtc
    timezone: ${timezone}
    update_interval: never
  - platform: sntp
    timezone: ${timezone}
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc
        - logger.log:
            level: INFO
            tag: clock
            format: Network time synced and saved to the RTC

elekstube_ips:
  id: tubes
  time_id: rtc
  leds_id: leds

button:
  - platform: template
    name: Play Animation
    icon: mdi:play
    on_press:
      - lambda: id(tubes).play_effect(id(animation_select).active_index().value_or(0), id(animation_duration).state);
  - platform: template
    name: Stop Animation
    icon: mdi:stop
    on_press:
      - lambda: id(tubes).stop_animation();

switch:
  - platform: template
    name: Displays
    icon: mdi:monitor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(tubes).set_displays_on(true);
    turn_off_action:
      - lambda: id(tubes).set_displays_on(false);
  - platform: template
    name: 24-Hour Format
    icon: mdi:hours-24
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(tubes).set_hour_24(true);
    turn_off_action:
      - lambda: id(tubes).set_hour_24(false);
  - platform: template
    name: Leading Zero
    icon: mdi:numeric-0-box-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(tubes).set_leading_zero(true);
    turn_off_action:
      - lambda: id(tubes).set_leading_zero(false);
  - platform: template
    name: Night Mode
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(tubes).set_night_enabled(true);
    turn_off_action:
      - lambda: id(tubes).set_night_enabled(false);

number:
  - platform: template
    name: Animation Duration
    id: animation_duration
    icon: mdi:timer-outline
    unit_of_measurement: s
    min_value: 1
    max_value: 600
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 10
  - platform: template
    name: Display Brightness
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 100
    on_value:
      - lambda: id(tubes).set_brightness(x);
  - platform: template
    name: Night Brightness
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 20
    on_value:
      - lambda: id(tubes).set_night_brightness(x);
  - platform: template
    name: Night Start
    icon: mdi:clock-start
    entity_category: config
    unit_of_measurement: h
    min_value: 0
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 23
    on_value:
      - lambda: id(tubes).set_night_start(x);
  - platform: template
    name: Night End
    icon: mdi:clock-end
    entity_category: config
    unit_of_measurement: h
    min_value: 0
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 7
    on_value:
      - lambda: id(tubes).set_night_end(x);

select:
  - platform: template
    name: Animation
    id: animation_select
    icon: mdi:animation-play
    optimistic: true
    restore_value: true
    options:
      - matrix
      - glitch
      - sweep
      - pulse
      - countdown
    initial_option: matrix
  - platform: template
    name: Digit Transition
    icon: mdi:transition
    optimistic: true
    restore_value: true
    options:
      - "Off"
      - Fade
    initial_option: "Off"
    on_value:
      - lambda: id(tubes).set_transition(i);
  - platform: template
    name: Clock Face
    icon: mdi:clock-digital
    optimistic: true
    restore_value: true
    options:
      - Nixie
      - Ice
      - Custom 1
      - Custom 2
      - Custom 3
    initial_option: Nixie
    on_value:
      - lambda: id(tubes).set_face(i);
  - platform: template
    name: Display Mode
    id: display_mode
    icon: mdi:test-tube
    entity_category: config
    optimistic: true
    options:
      - Clock
      - Identify Tubes
      - Bench Six Images
      - Bench Common Image
      - Bench JPEG Photo
      - Bench JPEG Graphic
    initial_option: Clock
    on_value:
      - lambda: id(tubes).set_mode(i);

sensor:
  - platform: template
    name: Frames Per Second
    icon: mdi:speedometer
    unit_of_measurement: fps
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(tubes).fps();
  - platform: template
    name: Free RAM
    icon: mdi:memory
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: return id(tubes).free_heap();
  - platform: template
    name: Largest RAM Block
    icon: mdi:memory
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: return id(tubes).largest_heap_block();
  - platform: wifi_signal
    name: WiFi Signal
    entity_category: diagnostic
    update_interval: 60s
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  - platform: gpio
    name: Left Button
    pin: {number: GPIO33, mode: INPUT, inverted: true}
  - platform: gpio
    name: Mode Button
    pin: {number: GPIO32, mode: INPUT, inverted: true}
  - platform: gpio
    name: Right Button
    pin: {number: GPIO35, mode: INPUT, inverted: true}
  - platform: gpio
    name: Power Button
    pin: {number: GPIO34, mode: INPUT, inverted: true}

light:
  - platform: esp32_rmt_led_strip
    id: leds
    name: Tube Backlight
    chipset: ws2812
    pin: GPIO12
    num_leds: 6
    channel_colors: GRB
    restore_mode: RESTORE_DEFAULT_OFF
    resume_effect: true
    effects:
      - pulse:
      - addressable_rainbow:
