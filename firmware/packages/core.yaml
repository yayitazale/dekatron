# The clock itself. Every profile needs this package.
esphome:
  on_boot:
    priority: 600
    then:
      - ds1307.read_time:
          id: rtc
      - lambda: |-
          auto now = id(rtc).now();
          id(rtc_boot_time) = now.is_valid() ? now.strftime("%Y-%m-%d %H:%M:%S") : "No valid time";
          ESP_LOGI("clock", "RTC time at boot: %s", id(rtc_boot_time).c_str());

globals:
  - id: rtc_boot_time
    type: std::string
    initial_value: '"Not read"'

external_components:
  - source: ../components

logger:
  level: INFO

safe_mode:

time:
  - platform: sntp
    timezone: ${timezone}
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc
        - logger.log:
            level: INFO
            tag: clock
            format: Network time synced and saved to the RTC

elekstube_ips:
  id: tubes
  time_id: rtc
  leds_id: leds
  face_select_id: clock_face

# What the physical buttons do. Any press first skips the animations after starting.
script:
  - id: press_left
    then:
      - if:
          condition:
            lambda: return !id(tubes).skip_startup();
          then:
            - select.previous:
                id: clock_face
                cycle: true
  - id: press_right
    then:
      - if:
          condition:
            lambda: return !id(tubes).skip_startup();
          then:
            - select.next:
                id: clock_face
                cycle: true
  - id: press_mode
    then:
      - if:
          condition:
            lambda: return !id(tubes).skip_startup();
          then:
            - lambda: id(tubes).toggle_countdown(id(countdown_minutes).state * 60);
  - id: press_power
    then:
      - if:
          condition:
            lambda: return !id(tubes).skip_startup();
          then:
            - switch.toggle: displays
  # Holding Mode for 10 seconds forgets the settings. Releasing it earlier cancels, but once the
  # screens have flashed the settings go either way, so a flash is never followed by nothing.
  - id: watch_mode_hold
    mode: restart
    then:
      - delay: 10s
      - script.execute: forget_settings
  - id: forget_settings
    mode: single
    then:
      - lambda: id(tubes).flash_displays();
      - delay: 1600ms
      - logger.log:
          level: WARN
          tag: clock
          format: Forgetting the settings and restarting
      - lambda: |-
          global_preferences->reset();
          App.safe_reboot();

button:
  - platform: template
    name: Play Animation
    icon: mdi:play
    on_press:
      - lambda: id(tubes).play_effect(id(animation_select).active_index().value_or(0), id(animation_duration).state);
  - platform: template
    name: Stop Animation
    icon: mdi:stop
    on_press:
      - lambda: id(tubes).stop_animation();

switch:
  - platform: template
    name: Displays
    id: displays
    icon: mdi:monitor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(tubes).set_displays_on(true);
    turn_off_action:
      - lambda: id(tubes).set_displays_on(false);
  - platform: template
    name: 24-Hour Format
    icon: mdi:hours-24
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(tubes).set_hour_24(true);
    turn_off_action:
      - lambda: id(tubes).set_hour_24(false);
  - platform: template
    name: Leading Zero
    icon: mdi:numeric-0-box-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(tubes).set_leading_zero(true);
    turn_off_action:
      - lambda: id(tubes).set_leading_zero(false);
  - platform: template
    name: Night Mode
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(tubes).set_night_enabled(true);
    turn_off_action:
      - lambda: id(tubes).set_night_enabled(false);

number:
  - platform: template
    name: Countdown Minutes
    id: countdown_minutes
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 60
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
  - platform: template
    name: Animation Duration
    id: animation_duration
    icon: mdi:timer-outline
    unit_of_measurement: s
    min_value: 1
    max_value: 600
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 10
  - platform: template
    name: Display Brightness
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 100
    on_value:
      - lambda: id(tubes).set_brightness(x);
  - platform: template
    name: Night Brightness
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 20
    on_value:
      - lambda: id(tubes).set_night_brightness(x);
  - platform: template
    name: Night Start
    icon: mdi:clock-start
    entity_category: config
    unit_of_measurement: h
    min_value: 0
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 23
    on_value:
      - lambda: id(tubes).set_night_start(x);
  - platform: template
    name: Night End
    icon: mdi:clock-end
    entity_category: config
    unit_of_measurement: h
    min_value: 0
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 7
    on_value:
      - lambda: id(tubes).set_night_end(x);

select:
  - platform: template
    name: Animation
    id: animation_select
    icon: mdi:animation-play
    optimistic: true
    restore_value: true
    options:
      - matrix
      - glitch
      - sweep
      - pulse
      - countdown
    initial_option: matrix
  - platform: template
    name: Digit Transition
    icon: mdi:transition
    optimistic: true
    restore_value: true
    options:
      - "Off"
      - Fade
    initial_option: "Off"
    on_value:
      - lambda: id(tubes).set_transition(i);
  - platform: template
    name: Clock Face
    id: clock_face
    icon: mdi:clock-digital
    optimistic: true
    restore_value: true
    # The clock replaces these with the faces it has, as its store changes.
    options:
      - Nixie
      - Custom 1
      - Custom 2
      - Custom 3
      - Custom 4
    initial_option: Nixie
    on_value:
      - lambda: id(tubes).set_face(i);
  - platform: template
    name: Display Mode
    id: display_mode
    icon: mdi:test-tube
    entity_category: config
    optimistic: true
    options:
      - Clock
      - Identify Tubes
    initial_option: Clock
    on_value:
      - lambda: id(tubes).set_mode(i);
