# EleksTube IPS Gen2. To support a similar clock, copy this file and change its pins.
esp32:
  variant: esp32
  flash_size: 4MB
  partitions: partitions.csv
  framework:
    type: esp-idf

i2c:
  sda: GPIO21
  scl: GPIO22

time:
  - platform: ds1307
    id: rtc
    timezone: ${timezone}
    update_interval: never

binary_sensor:
  - platform: gpio
    name: Left Button
    pin: {number: GPIO33, mode: INPUT, inverted: true}
  - platform: gpio
    name: Mode Button
    pin: {number: GPIO32, mode: INPUT, inverted: true}
  - platform: gpio
    name: Right Button
    pin: {number: GPIO35, mode: INPUT, inverted: true}
  - platform: gpio
    name: Power Button
    pin: {number: GPIO34, mode: INPUT, inverted: true}

light:
  - platform: esp32_rmt_led_strip
    id: leds
    name: Tube Backlight
    chipset: ws2812
    pin: GPIO12
    num_leds: 6
    channel_colors: GRB
    restore_mode: RESTORE_DEFAULT_OFF
    resume_effect: true
    effects:
      - pulse:
      - addressable_rainbow:
