<div id="app"></div>
<script>// Copyright (c) 2026 Joseba Egia and Dekatron contributors
// SPDX-License-Identifier: GPL-3.0-or-later
// The store of the clock, as tools/make_clips.py writes it and components/elekstube_ips/store.cpp reads it.
// Everything is little endian: a header, one entry per face or clip, the tables of images, and the images.
const DekatronStore = (() => {
  const MAGIC = [0x45, 0x4b, 0x53, 0x54]; // EKST
  const VERSION = 2;
  const HEADER_BYTES = 20;
  const ENTRY_BYTES = 32;
  const NAME_BYTES = 16;
  const TABLE_ENTRY_BYTES = 8;
  const KIND_CLIP = 0;
  const KIND_FACE = 1;
  const KIND_THEME = 2;
  const MAX_FACES = 4; // besides the one built into the firmware
  const FACE_IMAGES = 10;
  const FACE_INFO_IMAGES = 11; // a face may have an eleventh image: its information as JSON
  const SCENE = 0; // images per frame of a scene

  const CRC_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes, start = 0, end = bytes.length) {
    let crc = 0xffffffff;
    for (let i = start; i < end; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
    return (crc ^ 0xffffffff) >>> 0;
  }

  function tableLength(entry) {
    return entry.imagesPerFrame === SCENE ? 1 + entry.frames + entry.sceneBlobs + (entry.reserved & 1) : entry.frames * entry.imagesPerFrame;
  }

  function fail(rule, message) {
    const error = new Error(message);
    error.rule = rule;
    return error;
  }

  // Reads a store. Throws an Error that says what is wrong, after checking it like the clock does.
  // The `rule` of the error is the same word that tools/check_bin.py uses.
  function parse(buffer) {
    const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
    if (bytes.length < HEADER_BYTES) throw fail("not-a-store", "too short");
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    if (!MAGIC.every((value, i) => bytes[i] === value)) throw fail("not-a-store", "not a store");
    if (view.getUint32(4, true) !== VERSION) throw fail("version", "another version of the format");
    const total = view.getUint32(8, true);
    const count = view.getUint32(16, true);
    if (total !== bytes.length) throw fail("size-mismatch", `the header says ${total} bytes and the file has ${bytes.length}`);
    if (crc32(bytes, HEADER_BYTES, total) !== view.getUint32(12, true)) throw fail("bad-crc", "damaged: the checksum does not match");
    if (count < 1 || count > 255 || HEADER_BYTES + count * ENTRY_BYTES > total) throw fail("malformed", "malformed");

    const entries = [];
    for (let i = 0; i < count; i++) {
      const at = HEADER_BYTES + i * ENTRY_BYTES;
      let end = 0;
      while (end < NAME_BYTES && bytes[at + end] !== 0) end++;
      const entry = {
        name: new TextDecoder().decode(bytes.subarray(at, at + end)),
        frames: view.getUint32(at + 20, true),
        fps: view.getUint16(at + 24, true),
        imagesPerFrame: bytes[at + 26],
        kind: bytes[at + 27],
        sceneBlobs: view.getUint16(at + 28, true),
        reserved: view.getUint16(at + 30, true), // bit 0: a scene has a track of lights, which is its last image
        images: [],
      };
      const table = view.getUint32(at + 16, true);
      const length = tableLength(entry);
      if (table + length * TABLE_ENTRY_BYTES > total) throw fail("malformed", `${entry.name}: malformed`);
      for (let j = 0; j < length; j++) {
        const offset = view.getUint32(table + j * TABLE_ENTRY_BYTES, true);
        const size = view.getUint32(table + j * TABLE_ENTRY_BYTES + 4, true);
        if (offset + size > total) throw fail("malformed", `${entry.name}: malformed`);
        entry.images.push(bytes.subarray(offset, offset + size));
      }
      entries.push(entry);
    }
    return { entries, size: total };
  }

  function sameBytes(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  // Writes a store from entries like the ones parse() gives. Identical images are kept once.
  // `capacity` is the most it may take.
  function build(entries, capacity = Infinity) {
    if (!entries.length) throw new Error("nothing to store");
    if (entries.length > 255) throw new Error("at most 255 faces and clips");
    if (entries.filter((entry) => entry.kind === KIND_FACE).length > MAX_FACES) throw new Error(`a store holds at most ${MAX_FACES} faces`);
    if (entries.filter((entry) => entry.kind === KIND_THEME).length > 1) throw new Error("a store holds one theme");
    for (const [index, entry] of entries.entries()) {
      const encoded = new TextEncoder().encode(entry.name);
      if (encoded.length < 1 || encoded.length >= NAME_BYTES) throw new Error(`invalid name: ${entry.name}`);
      if (entries.some((other, j) => j !== index && other.kind === entry.kind && other.name === entry.name)) {
        throw new Error(`the name ${entry.name} is used twice`);
      }
      if (entry.images.length !== tableLength(entry)) throw new Error(`${entry.name}: wrong number of images`);
    }

    let position = HEADER_BYTES + ENTRY_BYTES * entries.length;
    const tables = [];
    for (const entry of entries) {
      tables.push(position);
      position += tableLength(entry) * TABLE_ENTRY_BYTES;
    }
    const payloadStart = position;

    // Images with the same bytes share one place, found through a cheap hash that is then checked.
    const places = new Map();
    const placed = [];
    let payloadSize = 0;
    const locate = (image) => {
      let hash = 0x811c9dc5;
      for (let i = 0; i < image.length; i++) hash = Math.imul(hash ^ image[i], 0x01000193) >>> 0;
      const key = `${hash}:${image.length}`;
      const candidates = places.get(key) || [];
      for (const candidate of candidates) if (sameBytes(candidate.image, image)) return candidate.offset;
      const offset = payloadStart + payloadSize;
      payloadSize += image.length;
      candidates.push({ image, offset });
      places.set(key, candidates);
      placed.push({ image, offset });
      return offset;
    };
    const offsets = entries.map((entry) => entry.images.map(locate));

    const total = payloadStart + payloadSize;
    if (total > capacity) throw new Error(`it takes ${total} bytes and the clock has room for ${capacity}`);
    const out = new Uint8Array(total);
    const view = new DataView(out.buffer);
    out.set(MAGIC, 0);
    view.setUint32(4, VERSION, true);
    view.setUint32(8, total, true);
    view.setUint32(16, entries.length, true);
    entries.forEach((entry, i) => {
      const at = HEADER_BYTES + i * ENTRY_BYTES;
      out.set(new TextEncoder().encode(entry.name), at);
      view.setUint32(at + 16, tables[i], true);
      view.setUint32(at + 20, entry.frames, true);
      view.setUint16(at + 24, entry.fps, true);
      out[at + 26] = entry.imagesPerFrame;
      out[at + 27] = entry.kind;
      view.setUint16(at + 28, entry.sceneBlobs, true);
      view.setUint16(at + 30, entry.reserved || 0, true);
      entry.images.forEach((image, j) => {
        view.setUint32(tables[i] + j * TABLE_ENTRY_BYTES, offsets[i][j], true);
        view.setUint32(tables[i] + j * TABLE_ENTRY_BYTES + 4, image.length, true);
      });
    });
    for (const { image, offset } of placed) out.set(image, offset);
    view.setUint32(12, crc32(out, HEADER_BYTES, total), true);
    return out;
  }

  // A clock face is ten images, one per digit, stored like a clip with one frame. With `info`, such as the
  // author and license, it has an eleventh image that holds them as JSON.
  function face(name, digitImages, info) {
    if (digitImages.length !== FACE_IMAGES) throw new Error("a face needs ten images");
    const images = [...digitImages];
    if (info && Object.keys(info).length) {
      const bytes = new TextEncoder().encode(JSON.stringify(info));
      if (bytes.length > 512) throw new Error("the data of a face is too long");
      images.push(bytes);
    }
    return { name, kind: KIND_FACE, frames: 1, fps: 1, imagesPerFrame: images.length, sceneBlobs: 0, images };
  }

  function faceInfo(entry) {
    if (entry.imagesPerFrame !== FACE_INFO_IMAGES) return {};
    return themeInfo({ images: [entry.images[FACE_IMAGES]] });
  }

  // A theme is its name and a little data, such as its author and license, kept as JSON in its one image.
  function theme(name, info) {
    const bytes = new TextEncoder().encode(JSON.stringify(info));
    if (bytes.length > 512) throw new Error("the data of a theme is too long");
    return { name, kind: KIND_THEME, frames: 1, fps: 1, imagesPerFrame: 1, sceneBlobs: 0, images: [bytes] };
  }

  function themeInfo(entry) {
    try {
      return JSON.parse(new TextDecoder().decode(entry.images[0]));
    } catch (error) {
      return {};
    }
  }


  // ---- Checking a file for the clock, with the rules of the clock. The same rules, in the same order and
  // with the same words for each one, as tools/check_bin.py: a test compares them.
  const TUBE_COUNT = 6;
  const TUBE_WIDTH = 135;
  const TUBE_HEIGHT = 240;
  const LED_FRAME_BYTES = 18;
  const THEME_ROLES = ["boot", "connecting", "online", "countdown_end"];
  const THEME_BYTES = 800 * 1024; // what a theme may take of the store
  const REGION_BYTES = 0x120000; // what the store of the clock holds
  const APP_BYTES = 0x160000; // the partition of the app
  const GALLERY_LICENSE = "CC-BY-SA-4.0";
  const MAX_REPORTED = 3;
  const SOF_MARKERS = [0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf];

  // The size and kind of a JPEG, or a string that says why the clock cannot read it.
  function jpegInfo(data) {
    if (data[0] !== 0xff || data[1] !== 0xd8) return "not a JPEG: it does not start with the JPEG marker";
    const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
    let i = 2;
    while (i + 4 <= data.length) {
      if (data[i] !== 0xff) return "damaged JPEG: a marker is missing";
      const marker = data[i + 1];
      if (marker === 0xff) {
        i += 1;
        continue;
      }
      if (marker === 0x01 || (marker >= 0xd0 && marker <= 0xd8)) {
        i += 2;
        continue;
      }
      const length = view.getUint16(i + 2, false);
      if (SOF_MARKERS.includes(marker)) {
        if (i + 10 > data.length) return "damaged JPEG: it ends inside its header";
        const components = data[i + 9];
        const sampling = [];
        for (let n = 0; n < components; n++) if (i + 11 + 3 * n < data.length) sampling.push(data[i + 11 + 3 * n]);
        return {
          baseline: marker === 0xc0,
          height: view.getUint16(i + 5, false),
          width: view.getUint16(i + 7, false),
          subsampling420: components === 3 && sampling[0] === 0x22 && sampling[1] === 0x11 && sampling[2] === 0x11,
        };
      }
      if (marker === 0xda) return "damaged JPEG: the picture starts before its size";
      i += 2 + length;
    }
    return "damaged JPEG: it has no size";
  }

  function classify(entries) {
    const faces = entries.filter((e) => e.kind === KIND_FACE);
    const themes = entries.filter((e) => e.kind === KIND_THEME);
    const clips = entries.filter((e) => e.kind === KIND_CLIP);
    if (faces.length === 1 && !themes.length && !clips.length) return "face";
    if (themes.length === 1 && !faces.length) return "theme";
    return "backup";
  }

  // Checks the bytes of a file for the clock. Gives {type, name, info, problems, warnings, ok}, where type is
  // "theme", "face", "backup" or "firmware", and each problem or warning is {rule, message}.
  function checkBin(buffer, { gallery = false } = {}) {
    const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
    const report = { type: "unknown", name: "", info: {}, problems: [], warnings: [] };
    const problem = (rule, message) => report.problems.push({ rule, message });
    const warn = (rule, message) => report.warnings.push({ rule, message });
    const done = () => {
      report.ok = report.problems.length === 0;
      return report;
    };

    const isStore = MAGIC.every((value, i) => bytes[i] === value);
    if (!isStore && bytes[0] === 0xe9) {
      report.type = "firmware";
      if (bytes.length < 0x10000) problem("firmware-size", "The file is too small to be a firmware.");
      else if (bytes.length > APP_BYTES) problem("firmware-size", `The firmware takes ${bytes.length} bytes and the app partition holds ${APP_BYTES}.`);
      if (bytes.length >= 14 && (bytes[12] | (bytes[13] << 8)) !== 0) problem("firmware-chip", "This firmware is for another chip, not the ESP32 of the clock.");
      return done();
    }

    let parsed;
    try {
      parsed = parse(bytes);
    } catch (error) {
      problem(error.rule || "malformed", error.message);
      return done();
    }
    const entries = parsed.entries;
    const faces = entries.filter((e) => e.kind === KIND_FACE);
    const themes = entries.filter((e) => e.kind === KIND_THEME);
    const clips = entries.filter((e) => e.kind === KIND_CLIP);
    report.type = classify(entries);

    if (faces.length > MAX_FACES) problem("too-many-faces", `It has ${faces.length} faces and the store holds ${MAX_FACES} besides the one in the firmware.`);
    if (themes.length > 1) problem("several-themes", "It has more than one theme and the store holds one.");
    for (const kind of [KIND_FACE, KIND_CLIP]) {
      const names = entries.filter((e) => e.kind === kind).map((e) => e.name);
      if (new Set(names).size !== names.length) problem("duplicate-name", "Two faces or two clips have the same name. Names must be unique.");
    }
    for (const entry of entries) {
      const length = new TextEncoder().encode(entry.name).length;

  const HEIGHT = 240;

  const CANVAS_WIDTH = (TUBE_COUNT - 1) * TUBE_PITCH + WIDTH;
  const TILE = 8;

  // Token below 128: repeat the next byte token + 1 times. Otherwise token - 127 literal bytes.
  function rle(indices) {
    const output = [];
    const literal = [];
    const flush = () => {
      if (literal.length) {
        output.push(127 + literal.length, ...literal);
        literal.length = 0;
      }

// that the tubes can show, and stored as a scene, with a light for each tube if asked.
const DekatronCreator = (() => {
  const S = DekatronScene;
  const idle = () => new Promise((resolve) => setTimeout(resolve, 0));
  const TYPES = { gif: "image/gif", webp: "image/webp", png: "image/png", apng: "image/apng", jpg: "image/jpeg", jpeg: "image/jpeg" };
  const extension = (file) => (file.name.match(/\.([^.]+)$/) || [])[1]?.toLowerCase() || "";

  // The pictures of one animation, whatever file they come from. count(fps) says how many frames there are
  // at that rate, and frame(k, fps) gives the k-th as something that can be drawn.
  async function openSource(files) {
    const list = [...files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    const first = list[0];
    if (list.length > 1) {
      return {
        still: false,
        count: () => list.length,
        async frame(k) {
          const bitmap = await createImageBitmap(list[k]);
          return { drawable: bitmap, width: bitmap.width, height: bitmap.height, release: () => bitmap.close() };
        },
        close() {},
      };
    }
    if (first.type.startsWith("video/")) return openVideo(first);
    if (typeof ImageDecoder === "undefined") throw new Error("This browser cannot read animated images. Use a video file, or a numbered series of images");
    const type = first.type || TYPES[extension(first)];
    if (!type) throw new Error(`${first.name}: not a picture or a video`);
    const decoder = new ImageDecoder({ data: await first.arrayBuffer(), type });
    await decoder.tracks.ready;
    const frames = decoder.tracks.selectedTrack.frameCount;
    const starts = [];
    let total = 0;
    for (let index = 0; index < frames; index++) {
      const { image } = await decoder.decode({ frameIndex: index });
      starts.push(total);
      total += (image.duration || 100000) / 1e6; // GIFs without a time play at 10 per second
      image.close();
    }
    return {
      still: frames === 1,
      count: (fps) => Math.max(1, Math.floor(total * fps)),
      async frame(k, fps) {
        const time = k / fps;
        let index = 0;
        while (index + 1 < frames && starts[index + 1] <= time) index++;
        const { image } = await decoder.decode({ frameIndex: index });
        return { drawable: image, width: image.displayWidth, height: image.displayHeight, release: () => image.close() };
      },
      close: () => decoder.close(),
    };
  }

  async function openVideo(file) {
    const video = document.createElement("video");
    video.muted = true;
    video.playsInline = true;
    video.preload = "auto";
    const link = URL.createObjectURL(file);
    video.src = link;
    await new Promise((resolve, reject) => {
      video.onloadedmetadata = resolve;
      video.onerror = () => reject(new Error(`${file.name}: this browser cannot play it`));
    });
    return {
      still: false,
      count: (fps) => Math.max(1, Math.floor(video.duration * fps)),
      async frame(k, fps) {
        await new Promise((resolve) => {
          video.onseeked = resolve;
          video.currentTime = Math.min(k / fps, Math.max(0, video.duration - 0.001));
        });
        return { drawable: video, width: video.videoWidth, height: video.videoHeight, release() {} };
      },
      close: () => URL.revokeObjectURL(link),
    };
  }

  // Draws a picture on the black strip: "fill" covers all of it and crops what sticks out, "fit" shows all of
  // the picture and leaves black around it.
  function painter(fit) {
    const canvas = document.createElement("canvas");
    canvas.width = S.CANVAS_WIDTH;
    canvas.height = S.HEIGHT;
    const context = canvas.getContext("2d", { willReadFrequently: true });
    return ({ drawable, width, height }) => {
      context.fillStyle = "#000";
      context.fillRect(0, 0, canvas.width, canvas.height);
      const scale = (fit ? Math.min : Math.max)(canvas.width / width, canvas.height / height);
      context.drawImage(drawable, (canvas.width - width * scale) / 2, (canvas.height - height * scale) / 2, width * scale, height * scale);
      return context.getImageData(0, 0, canvas.width, canvas.height);
    };
  }

  // Every frame of a role, as strips: those asked for in `only` (all when it is left out).
  // How many frames a role has: the whole of the file, or the seconds asked for if that is less. A still
  // picture lasts as long as asked.
  const framesOf = (source, role) => {
    const asked = Math.max(1, Math.floor(role.seconds * role.fps));
    return Math.min(source.still ? asked : source.count(role.fps), asked, 900);
  };

  async function* strips(source, role, only) {
    const draw = painter(role.fit);
    const total = framesOf(source, role);
    for (let k = 0; k < total; k++) {
      if (only && !only.has(k)) continue;
      const picture = await source.frame(source.still ? 0 : k, role.fps);
      const strip = draw(picture);
      picture.release();
      yield [k, total, strip];
    }
  }

  const half = (strip) => {
    const width = strip.width >> 1;
    const height = strip.height >> 1;
    const data = new Uint8ClampedArray(width * height * 4);
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) data.set(strip.data.subarray(((y * 2) * strip.width + x * 2) * 4, ((y * 2) * strip.width + x * 2) * 4 + 4), (y * width + x) * 4);
    }
    return { data, width, height };
  };

  // roles: [{ name, files, fps, seconds, fit, lights }] for the animations that are new. Gives
  // { clips: [entries], bytes } and calls report(text, fraction) as it goes. `stop.now` ends it early.
  async function makeClips(roles, capacity, report, stop = {}) {
    const sources = [];
    for (const role of roles) sources.push(await openSource(role.files));
    try {
      // The palette is shared by the animations, so they come out in the same colors and can share images.
      const samples = [];
      for (const [index, role] of roles.entries()) {
        const total = framesOf(sources[index], role);
        const wanted = new Set(Array.from({ length: Math.min(8, total) }, (_, n) => Math.floor((n * total) / Math.min(8, total))));
        for await (const [, , strip] of strips(sources[index], role, wanted)) samples.push(half(strip));
        report(`Choosing colors for ${role.label}`, (index + 1) / (roles.length * 4));
        await idle();
      }
      const entries = S.buildPalette(samples);
      const quantize = S.makeQuantizer(entries);
      const clips = [];
      let bytes = 0;
      for (const [index, role] of roles.entries()) {
        const encoder = S.sceneEncoder(entries);
        const follow = role.lights ? S.ledFollower() : null;
        const lights = [];
        for await (const [k, total, strip] of strips(sources[index], role)) {
          if (stop.now) throw new Error("Stopped");
          encoder.add(quantize(strip));
          if (follow) lights.push(follow(strip));
          if (k % 3 === 0) {
            report(`${role.label}: frame ${k + 1} of ${total}`, 0.25 + 0.75 * ((index + (k + 1) / total) / roles.length));
            await idle();
          }
          if (bytes + encoder.size() > capacity) throw new Error(`${role.label} is too big for the clock. Try fewer seconds, fewer frames per second, or something with less moving`);
        }
        const leds = follow ? new Uint8Array(lights.length * 18) : null;
        if (follow) lights.forEach((frame, i) => leds.set(frame, i * 18));
        const scene = encoder.finish(leds);
        bytes += encoder.size() + (leds ? leds.length : 0);
        clips.push(S.toClip(role.name, role.fps, scene));
      }
      return { clips, bytes };
    } finally {
      sources.forEach((source) => source.close());
    }
  }

  return { makeClips };
})();

// The theme creator as a page of its own. It runs in the browser and sends nothing anywhere: it makes a
// theme file, which the page of the clock takes with Change theme.
(() => {
  "use strict";
  const Store = DekatronStore;
  const ROLES = [["boot", "Startup"], ["connecting", "Connecting"], ["online", "Connected"], ["countdown_end", "Countdown finale"]];
  // The clock holds 1152 KB of faces and theme. This leaves room for four faces.
  const BUDGET = 900000;

  const h = (tag, attributes = {}, ...children) => {
    const element = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes)) {
      if (name === "class") element.className = value;
      else if (name.startsWith("on")) element.addEventListener(name.slice(2), value);
      else if (value === true) element.setAttribute(name, "");
      else if (value !== false && value != null) element.setAttribute(name, value);
    }
    for (const child of children.flat()) element.append(child?.nodeType ? child : document.createTextNode(child ?? ""));
    return element;
  };
  const card = (title, ...content) => h("section", { class: "card" }, h("h2", {}, title), content);
  const kilobytes = (bytes) => `${Math.round(bytes / 1024)} KB`;

  document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

  function dialog(title, content, buttons) {
    const box = h("dialog", {}, h("h3", {}, title), content, h("div", { class: "row" }, buttons));
    document.body.append(box);
    box.showModal();
    return { close: () => { box.close(); box.remove(); } };
  }

  const toast = (message, bad = false) => {
    document.querySelector(".toast")?.remove();
    const element = h("div", { class: "toast" + (bad ? " bad" : "") }, message);
    document.body.append(element);
    setTimeout(() => element.remove(), bad ? 7000 : 3000);
  };

  const name = h("input", { type: "text", maxlength: 15, placeholder: "Name of the theme", class: "grow" });
  const author = h("input", { type: "text", maxlength: 40, placeholder: "Your name (optional)", class: "grow" });
  const about = h("input", { type: "text", maxlength: 160, placeholder: "A line about it (optional)", class: "grow" });
  const fit = h("select", { class: "grow", "aria-label": "Picture on the strip" },
    [h("option", { value: "fill" }, "Fill the strip, cropping"), h("option", { value: "fit" }, "Fit inside, with black around")]);
  const lights = h("select", { class: "grow", "aria-label": "Lights" },
    [h("option", { value: "follow" }, "Lights follow the picture"), h("option", { value: "off" }, "No lights")]);
  const result = h("div", {});

  const picks = ROLES.map(([role, label]) => {
    const pick = { role, label, files: null };
    const shown = h("span", { class: "muted" }, "Nothing chosen");
    const input = h("input", { type: "file", accept: "image/*,video/*", multiple: true, hidden: true });
    input.addEventListener("change", () => {
      pick.files = input.files.length ? [...input.files] : null;
      shown.textContent = pick.files ? (pick.files.length > 1 ? `${pick.files.length} images` : pick.files[0].name) : "Nothing chosen";
    });
    pick.seconds = h("input", { type: "number", min: 1, max: 60, value: label === "Connecting" ? 8 : 10, "aria-label": `${label} seconds` });
    pick.fps = h("input", { type: "number", min: 1, max: 30, value: 15, "aria-label": `${label} frames per second` });
    pick.row = h("div", { class: "item" }, h("div", { class: "grow" },
      h("div", { class: "name" }, label),
      h("div", { class: "row" }, h("button", { class: "btn", onclick: () => input.click() }, "Choose"), input, shown),
      h("div", { class: "row" }, h("span", { class: "muted" }, "Seconds"), pick.seconds, h("span", { class: "muted" }, "per second"), pick.fps)));
    return pick;
  });

  async function make() {
    result.replaceChildren();
    if (!name.value.trim()) return toast("Give the theme a name", true);
    const missing = picks.find((pick) => !pick.files);
    if (missing) return toast(`Choose a file for ${missing.label}`, true);
    const roles = picks.map((pick) => ({
      name: pick.role, label: pick.label, files: pick.files, fps: Math.min(30, Math.max(1, +pick.fps.value || 15)),
      seconds: Math.min(60, Math.max(1, +pick.seconds.value || 8)), fit: fit.value === "fit", lights: lights.value === "follow",
    }));
    const progress = h("progress", { max: 1, value: 0 });
    const text = h("p", { class: "muted" }, "Reading the files…");
    const stop = { now: false };
    const shown = dialog("Making the theme…", h("div", {}, progress, text), [h("button", { class: "btn", onclick: () => { stop.now = true; } }, "Stop")]);
    try {
      const made = await DekatronCreator.makeClips(roles, BUDGET, (message, fraction) => { text.textContent = message; progress.value = fraction; }, stop);
      const info = {};
      if (author.value.trim()) info.author = author.value.trim();
      if (about.value.trim()) info.description = about.value.trim();
      const bytes = Store.build([Store.theme(name.value.trim(), info), ...made.clips]);
      const link = h("a", { class: "btn primary", href: URL.createObjectURL(new Blob([bytes])), download: `${name.value.trim()}.bin` }, `Download ${name.value.trim()}.bin`);
      result.replaceChildren(
        h("p", {}, `Ready: ${kilobytes(bytes.length)}, with ${made.clips.map((clip) => `${clip.frames} frames`).join(", ")}.`),
        h("p", { class: "muted" }, "On the page of your clock, open Style, press Change theme and choose this file, then Apply."),
        h("div", { class: "row" }, link));
    } catch (error) {
      toast(error.message, true);
    } finally {
      shown.close();
    }
  }

  document.getElementById("app").append(
    h("header", {}, h("div", { class: "brand" }, "Deka", h("b", {}, "tron"), " themes")),
    card("Create a theme",
      h("p", { class: "muted" }, "A theme is four animations: when the clock starts, while it connects, when it is connected and at the end of a countdown. Use an animated GIF, WebP or PNG, a video, or a numbered series of images for each. The animation crosses the six tubes as one wide strip, nearly six times as wide as tall. Nothing leaves your computer."),
      h("div", { class: "row" }, name), h("div", { class: "row" }, author), h("div", { class: "row" }, about),
      h("div", { class: "row" }, fit), h("div", { class: "row" }, lights),
      h("div", {}, picks.map((pick) => pick.row)),
      h("div", { class: "row", style: "margin-top:14px" }, h("button", { class: "btn primary", onclick: make }, "Create")),
      result),
    card("Tips",
      h("p", { class: "muted" }, "Few colors and small movements make small files. The clock has room for about 1 MB of faces and theme together, and this page keeps your theme under 880 KB so four faces still fit. If it is too big, use fewer seconds or fewer frames per second."),
      h("p", { class: "muted" }, "The lights take the color of what is on each tube, and the tubes are lit left to right, so put the action where the tubes are.")));
})();
</script>
</body>
